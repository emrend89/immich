name: Build my server image

# Applies the changes from the my-changes branch on top of the latest Immich release,
# tests them and publishes the server image. Runs nightly to pick up new releases.

on:
  workflow_dispatch:
  push:
    branches: [my-changes]
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

env:
  UPSTREAM_REPO: immich-app/immich
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/immich-server
  ML_IMAGE: ghcr.io/${{ github.repository_owner }}/immich-machine-learning
  ML_UPSTREAM_IMAGE: ghcr.io/immich-app/immich-machine-learning
  ML_VARIANT: openvino

jobs:
  check:
    name: Check for new Immich release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      should_build: ${{ steps.release.outputs.should_build }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          version=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name')
          should_build=true

          # Scheduled runs only build when there is no image for the latest release yet
          if [[ "${EVENT}" == "schedule" ]] && docker buildx imagetools inspect "${SERVER_IMAGE}:${version}" > /dev/null 2>&1; then
            should_build=false
          fi

          echo "version=${version}" | tee -a "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" | tee -a "$GITHUB_OUTPUT"
          echo "should_build=${should_build}" | tee -a "$GITHUB_OUTPUT"

  server:
    name: Build and Push Server
    needs: check
    if: ${{ needs.check.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      MAJOR: ${{ needs.check.outputs.major }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: my-changes
          fetch-depth: 0
          persist-credentials: false

      - name: Apply my changes to the latest release
        run: |
          git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" '+refs/tags/v*:refs/tags/v*'

          # my-changes is based on a release tag; its own commits (minus workflows) form the patch
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)
          echo "my-changes is based on ${base}, applying it to ${VERSION}"
          git diff --binary "${base}" HEAD -- . ':(exclude).github' > "${RUNNER_TEMP}/my-changes.patch"

          git -c advice.detachedHead=false checkout "${VERSION}"
          if ! git apply --index --3way "${RUNNER_TEMP}/my-changes.patch"; then
            echo "::error::my-changes no longer applies cleanly to ${VERSION}. Rebase my-changes onto ${VERSION} manually."
            exit 1
          fi
          git diff --cached --stat

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Run duplicate tests
        run: |
          pnpm install --frozen-lockfile --filter immich...
          pnpm --filter @immich/sdk build
          pnpm --filter @immich/plugin-sdk build
          cd server
          pnpm exec vitest run --config test/vitest.config.mjs src/utils/duplicate.spec.ts src/services/duplicate.service.spec.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ env.VERSION }}
            ${{ env.SERVER_IMAGE }}:${{ env.MAJOR }}
            ${{ env.SERVER_IMAGE }}:release
          build-args: |
            DEVICE=cpu
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ env.VERSION }}
            BUILD_SOURCE_REF=${{ env.VERSION }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mirror matching machine learning image
        run: |
          # Keeps the machine learning image in step with the server image under the same tags
          docker buildx imagetools create \
            -t "${ML_IMAGE}:${VERSION}-${ML_VARIANT}" \
            -t "${ML_IMAGE}:${MAJOR}-${ML_VARIANT}" \
            -t "${ML_IMAGE}:release-${ML_VARIANT}" \
            "${ML_UPSTREAM_IMAGE}:${VERSION}-${ML_VARIANT}"
